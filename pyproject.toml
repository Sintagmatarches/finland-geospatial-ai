[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finland-geospatial-ai"
version = "0.1.0"
description = "Spatially honest land-cover semantic segmentation of Finnish Sentinel-2 imagery"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "matplotlib==3.10.5",
  "mlflow==3.3.2",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "rasterio==1.4.3",
  "scikit-learn==1.7.1",
  "torch==2.7.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[project.scripts]
geoai-data = "finland_geoai.data.build:main"
geoai-train = "finland_geoai.training.run:main"
geoai-evaluate = "finland_geoai.evaluation.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

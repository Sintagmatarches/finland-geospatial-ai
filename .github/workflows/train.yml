name: Manual training

on:
  workflow_dispatch:

jobs:
  train-selected-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m finland_geoai.data.build --config configs/dataset.yaml
      - run: python -m finland_geoai.data.validate --manifest artifacts/dataset-manifest-v1.json
      - run: python -m finland_geoai.training.run --config configs/unet_ce.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: selected-model-training-evidence
          path: |
            artifacts/checkpoints/unet-ce-best.pt
            artifacts/experiment-runs.json
            mlruns

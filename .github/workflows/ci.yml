name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools==83.0.0
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit dependencies and produce a CycloneDX SBOM
        run: pip-audit --format cyclonedx-json --output security-sbom.json
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-sbom
          path: security-sbom.json
      - run: ruff check src tests
      - run: mypy src/finland_geoai src/finland_geospatial_ai
      - run: pytest --cov=finland_geospatial_ai --cov-report=term-missing --cov-fail-under=75
      - run: docker build -f docker/Dockerfile -t finland-geospatial-ai:${{ github.sha }} .
      - run: python scripts/create_smoke_assets.py
      - name: Validate Docker model load, health and inference
        run: |
          docker run --detach --name geoai-smoke \
            --publish 8000:8000 \
            --volume "$PWD/artifacts/smoke:/models:ro" \
            finland-geospatial-ai:${{ github.sha }}
          trap 'docker rm --force geoai-smoke' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' geoai-smoke | grep --quiet true; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs geoai-smoke
            docker inspect geoai-smoke --format '{{json .State}}'
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/model > artifacts/smoke/model-response.json
          curl --fail --silent --form file=@artifacts/smoke/input.tif \
            http://127.0.0.1:8000/predict --output artifacts/smoke/prediction-package.zip
          python -c "import zipfile; names=set(zipfile.ZipFile('artifacts/smoke/prediction-package.zip').namelist()); assert names == {'prediction.tif','confidence.tif','summary.json'}"

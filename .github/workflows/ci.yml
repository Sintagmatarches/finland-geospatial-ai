name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m finland_geoai.data.validate --manifest artifacts/dataset-manifest-v1.json --skip-files
      - run: pytest --cov=finland_geoai --cov-report=term-missing
      - run: docker build -f docker/Dockerfile -t finland-geospatial-ai:test .

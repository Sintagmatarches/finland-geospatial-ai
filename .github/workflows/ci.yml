name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/finland_geoai src/finland_geospatial_ai
      - run: pytest --cov=finland_geospatial_ai --cov-report=term-missing --cov-fail-under=75
      - run: docker build -f docker/Dockerfile -t finland-geospatial-ai:${{ github.sha }} .
      - run: python scripts/create_smoke_assets.py
      - name: Validate Docker model load, health and inference
        run: |
          docker run --detach --name geoai-smoke \
            --publish 8000:8000 \
            --volume "$PWD/artifacts/smoke:/models:ro" \
            finland-geospatial-ai:${{ github.sha }}
          trap 'docker rm --force geoai-smoke' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/model > artifacts/smoke/model-response.json
          curl --fail --silent --form file=@artifacts/smoke/input.tif \
            http://127.0.0.1:8000/predict --output artifacts/smoke/prediction-package.zip
          python -c "import zipfile; names=set(zipfile.ZipFile('artifacts/smoke/prediction-package.zip').namelist()); assert names == {'prediction.tif','confidence.tif','summary.json'}"

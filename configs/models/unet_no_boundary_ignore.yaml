experiment_id: E2-unet-no-boundary-ignore
question: Does excluding uncertain NLS vector boundaries improve spatial validation?
use_boundary_ignore: false
model:
  architecture: unet
  in_channels: 3
  num_classes: 5
  base_channels: 24
  pretrained: false
training:
  epochs: 30
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 7
  num_workers: 2
  seed: 3067
  amp: true
  loss: cross_entropy_dice
  dice_weight: 0.5
  augmentation:
    dihedral: true
    brightness: 0.08
    contrast: 0.08
